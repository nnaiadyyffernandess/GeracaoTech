<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>

<body>
    
    <!-- GET e POST -->
     <h1>Exemplos de <strong>INPUT</strong></h1>
    <form action="" method="post" >
     
        <div>
            <label for="text">Texto:</label>
            <input placeholder="Insira um texto qualquer" type="text" id="texto" name="texto">
        </div>

        <br>

        <div>
            <label for="number">Número:</label>
            <input placeholder="Insira um número" type="number" id="numero" name="numero">
        </div>
          <br>
        <div>
            <label for="date">Data:</label>
            <input placeholder="Selecione uma data" type="date" id="data" name="data">
        </div>
<br>
        <div>
            <label for="email">Email:</label>
            <input placeholder="Insira seu email" type="email" id="email" name="email">
        </div>
         <br>
        <div>
            <label for="password">Senha:</label>
            <input placeholder="Insira sua senha" type="password" id="password" name="password">
        </div>
        <br>

        <div>
            <label for="checkbox">Checkbox:</label>
            <input placeholder="Marque esta opção" type="checkbox" id="checkbox" name="checkbox">
        </div>
          <br>

        <div>
            <label for="datetime-local">Data e Hora:</label>
            <input placeholder="Selecione uma data e hora" type="datetime-local" id="datetime-local" name="datetime-local">
        </div>
          <br>

          <div>
            <label for="color">Cor:</label>
            <input placeholder="Selecione uma cor" type="color" id="color" name="color">
          </div>
          <br>
          <div>
            <label for="select">Selecione uma opção:</label>
            <select name="opcao" id="select">
                <option disabled value="">Selecione Uma Opção:</option>
                <option value="opcao1">Opção 1</option>
                <option value="opcao2">Opção 2</option>
                <option value="opcao3">Opção 3</option>
            </select>
          </div>
            <br>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
