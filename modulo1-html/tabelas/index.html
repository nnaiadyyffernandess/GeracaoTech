<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: rgb(248, 194, 248);
            text-align: center;
        }
        h1{
            text-align: center;
        }
        table{
            margin: 0 auto;
            border-collapse: collapse;
            width: 50%;
        }
    </style>
</head>
<body>
    <h1>Como inserir tabelas </h1>

    <h2>Exemplo de tabela: meus estudos!</h2>
    <br>
    <table border="1">
        <caption>Cronograma de Estudos </caption>
      <thead>
          <tr>
            <th>Dia</th>
            <th>Matérias</th>
          </tr>
      </thead>

      <tbody>
          <tr>
            <td>Segunda-feira</td>
            <td>JAVA e S.O</td>
          </tr>
          <tr>
            <td>Terça-feira</td>
            <td>PHP e Eng. de Software</td>
          </tr>
            <tr>
                <td>Quarta-feira</td>
                <td>Usabilidade e S.O</td>
            </tr>
            <tr>
                <td>Quinta-feira</td>
                <td>UML e Matemática</td>
            </tr>
            <tr>
                <td>Sexta-feira</td>
                <td>Matemática e Eng. de Software</td>
            </tr>
            <tr>
                <td>Sábado</td>
                <td>Python e UML </td>
            </tr>
      </tbody>
      <tfoot>
            <tr>
                <td colspan="2">Bons Estudos!</td>
            </tr>
      </tfoot>
    </table>
</body>
</html>
