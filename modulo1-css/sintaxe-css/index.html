<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Sintaxe do CSS </title>

    <style>
        /* pderia ser .titulo ou #titulo */
        h1{
            color:red;
            background-color: lightgreen;
            border: 5px solid rgb(20, 100, 0);
            text-align: center;
            text-shadow: 1px 1px 2px black;
            box-shadow: 5px 5px 10px gray;
        }

        body{
            background-color: rgb(255, 255, 195);
        }

    </style>

</head>
<body>
    
    <h1 id="titulo" class="titulo">Aula de Sintaxe do CSS</h1>
    <h2 class="subtitulo">Descrevendo a sintaxe do CSS</h2>

</body>
</html>
